name: alfa-course-recsys

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_BIND_HOST}:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  db-restore:
    image: postgres:17.11-bookworm
    entrypoint: [bash, /restore/restore.sh]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGCONNECT_TIMEOUT: "5"
      RESTORE_BACKUP: /backups/${POSTGRES_BACKUP_FILE}
    volumes:
      - type: bind
        source: ./deploy/postgres
        target: /restore
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${POSTGRES_BACKUP_DIR}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true

  app:
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: app
    user: "${LOCAL_UID}:${LOCAL_GID}"
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      HTTP_ADDR: 0.0.0.0:8080
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
      CATALOG_CURATION_PATH: /data/catalog_curation.json
      TEXT_SCORES_PATH: /data/ranking_text_scores.json
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    depends_on:
      text-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s

  catalog-export:
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: catalog-export
    user: "${LOCAL_UID}:${LOCAL_GID}"
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      CATALOG_CURATION_PATH: /data/catalog_curation.json
      TEXT_SCORES_PATH: /data/ranking_text_scores.json
    command: [--documents-only, --output, /data/ranking_catalog.json]
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    depends_on:
      db-restore:
        condition: service_completed_successfully
    restart: "no"

  text-prepare:
    pull_policy: build
    build: ./ranking
    user: "${LOCAL_UID}:${LOCAL_GID}"
    network_mode: none
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    depends_on:
      catalog-export:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
